<!--
  Template do e-mail "Confirm signup" do Supabase Auth, em português.
  Onde colar: Supabase > Authentication > Email Templates > Confirm signup.
  Assunto sugerido: Confirme seu e-mail para acessar a agenda

  IMPORTANTE: o link aponta para /auth/confirm do SEU site (rota criada no app),
  e não para {{ .ConfirmationURL }}. Assim a confirmação funciona em qualquer
  navegador/aparelho e a sessão é criada no próprio site.
  Confira também Authentication > URL Configuration: Site URL = endereço do site.
-->
<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:24px 12px;background:#f6f6f6;font-family:Poppins,Arial,sans-serif;color:#4e4add;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;">
      <tr>
        <td style="background:#3c38cf;background-image:linear-gradient(180deg,#7a74ff,#3c38cf);border-radius:16px 16px 0 0;padding:22px 24px;color:#ffffff;font-size:18px;">
          Agenda
        </td>
      </tr>
      <tr>
        <td style="background:#ffffff;border-radius:0 0 16px 16px;padding:24px;font-size:15px;line-height:1.5;">
          <p style="margin:0 0 12px;font-size:16px;">Olá!</p>
          <p style="margin:0 0 16px;">
            Falta só um passo para ativar a sua conta. Toque no botão abaixo para confirmar o seu e-mail.
          </p>
          <p style="margin:0 0 16px;">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
               style="display:inline-block;background:#3c38cf;color:#ffffff;text-decoration:none;border-radius:12px;padding:12px 22px;font-size:14px;">
              Confirmar meu e-mail
            </a>
          </p>
          <p style="margin:0;font-size:12px;color:#8e8aee;">
            Se você não criou uma conta, é só ignorar este e-mail.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
